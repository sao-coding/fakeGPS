name: Release APK

# Triggered by pushing a version tag (e.g. `git tag v1.2.0 && git push origin v1.2.0`).
# Also runnable manually from the Actions tab — pick the tag to build from in the "Use workflow
# from" dropdown when dispatching.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write # needed to create the GitHub Release and upload the APK to it

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        # compileSdk 36 is recent enough that it isn't guaranteed to already be on the runner
        # image — this both installs whatever's missing and accepts the SDK licenses Gradle
        # would otherwise need to auto-download it, which fails non-interactively without them.
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set — see the workflow's own comments for setup." >&2
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Rename APK for the release asset
        id: apk
        run: |
          tag="${GITHUB_REF_NAME}"
          apk_path=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n1)
          out="KoimsuraiGPS-${tag}.apk"
          cp "$apk_path" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          # Manual (workflow_dispatch) runs off a branch have no tag to attach the release to —
          # only push-tag runs actually publish a release.
          draft: ${{ github.event_name == 'workflow_dispatch' }}
